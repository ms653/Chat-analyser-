<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Analysis — Example Output (Anonymised)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f8f9fa;--surface:#ffffff;--border:#e2e8f0;--text:#1a202c;--muted:#718096;
  --user:#25D366;--contact:#1a73e8;--warn:#f59e0b;--danger:#ef4444;--ok:#10b981;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.6}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header h1{font-size:18px;font-weight:700}
.header .meta{color:var(--muted);font-size:13px}
.example-banner{background:#fef3c7;border-bottom:1px solid #fcd34d;padding:10px 24px;font-size:13px;text-align:center}
.page-layout{display:flex;align-items:flex-start}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:8px 0}
.sidebar-title{padding:8px 16px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sb-btn{display:block;width:100%;padding:10px 16px;border:none;background:transparent;text-align:left;cursor:pointer;border-left:3px solid transparent;transition:background .15s,border-color .15s}
.sb-btn:hover{background:var(--bg);border-left-color:var(--border)}
.sb-btn.active{background:#eff6ff;border-left-color:var(--contact)}
.sb-btn.active .sb-name{color:var(--contact)}
.sb-btn.active .sb-sub,.sb-btn.active .sb-tag{color:var(--contact);opacity:.8}
.sb-btn.active .sb-flag{color:var(--warn)}
.sb-name{display:block;font-weight:600;font-size:14px}
.sb-sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sb-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:var(--bg);border:1px solid var(--border);margin:3px 2px 0 0}
.sb-flag{display:inline-block;font-size:11px;color:var(--warn);margin-top:3px}
.main-area{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0;overflow-x:auto}
.tab-btn{padding:12px 18px;border:none;background:transparent;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab-btn.active{color:var(--contact);border-bottom-color:var(--contact)}
.main{max-width:1200px;margin:0 auto;padding:24px}
@media(max-width:700px){
  .page-layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px}
  .sidebar-title{display:none}
  .sb-btn{width:auto;display:inline-block;padding:5px 12px;border-radius:20px;border:1px solid var(--border);border-left:1px solid var(--border);font-size:13px;margin:0}
  .sb-btn:hover{background:var(--bg);border-left-color:var(--border)}
  .sb-btn.active{background:var(--contact);color:#fff;border-left-color:var(--contact)}
  .sb-btn.active .sb-name{color:#fff}
  .sb-sub,.sb-tag,.sb-flag{display:none}
  .sb-name{font-size:13px}
}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px;font-weight:700;margin-bottom:12px}
.card h3{font-size:14px;font-weight:600;margin-bottom:8px}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--bg);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:120px;text-align:center}
.stat .val{font-size:28px;font-weight:700}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.stat.ok .val{color:var(--ok)}
.stat.warn .val{color:var(--warn)}
.bubble-day{margin-bottom:20px}
.day-label{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px;font-weight:600}
.bubble{display:flex;margin-bottom:6px}
.bubble.user{justify-content:flex-end}
.bubble-inner{max-width:65%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5}
.bubble.user .bubble-inner{background:var(--user);color:#fff;border-bottom-right-radius:4px}
.bubble.contact .bubble-inner{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:6px;vertical-align:middle}
.badge.distress{background:#fef3c7;color:#92400e}
.badge.visit_offered{background:#dbeafe;color:#1e40af}
.badge.visit_cancelled{background:#fed7aa;color:#9a3412}
.badge.visit_happened{background:#dcfce7;color:#166534}
.note-section{margin-top:16px;border-top:2px dashed #e2e8f0;padding-top:12px}
.note-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
textarea.note{width:100%;border:2px dashed #d1d5db;border-radius:var(--radius);padding:10px 12px;font-size:13px;resize:vertical;min-height:80px;background:#fefce8;color:var(--text);font-family:inherit;line-height:1.6;outline:none;transition:border-color .15s,background .15s}
textarea.note:focus{border-color:#f59e0b;background:#fff}
textarea.note:not(:placeholder-shown){background:#fffbeb;border-color:#d97706;border-style:solid}
.bar{height:20px;border-radius:4px;display:flex;overflow:hidden;margin-bottom:8px}
.bar-user{background:var(--user)}
.bar-contact{background:var(--contact)}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:2px}
.notes-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.btn-note-action{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text)}
.btn-note-action:hover{background:var(--contact);color:#fff;border-color:var(--contact)}
.timeline-event{padding:10px 14px;border-left:3px solid var(--border);margin-bottom:8px;font-size:13px}
.timeline-event.positive{border-color:var(--ok)}
.timeline-event.warning{border-color:var(--warn)}
.timeline-event .event-date{font-size:11px;color:var(--muted);margin-bottom:4px}
.person-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.person-card .name{font-weight:700;font-size:15px;margin-bottom:4px}
.person-card .label{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;background:var(--bg);border:1px solid var(--border);margin-bottom:8px}
.sb-wrap{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:4px}
.sb-pos{background:var(--ok)}.sb-neu{background:var(--border)}.sb-neg{background:var(--danger)}
.contrast-pair{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.claimed{color:var(--muted);font-size:13px;margin-bottom:6px}
.claimed::before{content:"💬 Claimed: ";font-weight:600;color:var(--text)}
.record{color:var(--text);font-size:13px}
.record::before{content:"📊 Record shows: ";font-weight:600}
.fw-item{border-left:3px solid var(--contact);padding:8px 12px;margin-bottom:10px;font-size:13px}
.fw-original{font-weight:600;margin-bottom:4px}
.fw-suggestion{color:var(--contact);margin-bottom:2px}
.fw-basis{color:var(--muted);font-size:12px;font-style:italic}
.visit-event{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.visit-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.visit-dot.offered{background:var(--contact)}.visit-dot.cancelled{background:var(--warn)}.visit-dot.happened{background:var(--ok)}
.cross-chat-card{border-left:4px solid var(--warn);padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;margin-bottom:10px;font-size:13px}
.chart-wrap{position:relative;height:280px;margin-bottom:16px}
.chart-wrap-sm{position:relative;height:200px;margin-bottom:8px}
.no-data{color:var(--muted);font-size:14px;text-align:center;padding:32px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--bg);border:1px solid var(--border);margin-right:4px}
</style>
</head>

let _lastSingleTab = "timeline";
let charts = {};

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(d){ if(!d||d==="None") return ""; const dt=new Date(d); return isNaN(dt)?d:dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function badge(i){
  const m={DISTRESS_SIGNAL:"distress",VISIT_OFFERED:"visit_offered",VISIT_CANCELLED:"visit_cancelled",VISIT_HAPPENED:"visit_happened"};
  const l={DISTRESS_SIGNAL:"distress",VISIT_OFFERED:"visit offered",VISIT_CANCELLED:"visit cancelled",VISIT_HAPPENED:"✓ visit"};
  return m[i]?`<span class="badge ${m[i]}">${l[i]}</span>`:"";
}
function noteKey(cid,date){ return `note_${cid}_${date}`; }
function saveNote(cid,date,val){
  localStorage.setItem(noteKey(cid,date),val);
  if(typeof pywebview!=='undefined'&&pywebview.api&&pywebview.api.save_note)
    pywebview.api.save_note(noteKey(cid,date),val).catch(()=>{});
}
function loadNote(cid,date){ return localStorage.getItem(noteKey(cid,date))||""; }
function exportNotes(){
  const out={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('note_')) out[k]=localStorage.getItem(k); }
  if(!Object.keys(out).length){ alert('No notes saved yet.'); return; }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download='whatsapp_analyser_notes.json'; a.click();
}
function importNotes(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{ const r=new FileReader(); r.onload=ev=>{
    try{ const n=JSON.parse(ev.target.result); Object.entries(n).forEach(([k,v])=>localStorage.setItem(k,v)); renderMain(); }
    catch(err){ alert('Could not read file: '+err.message); }
  }; r.readAsText(e.target.files[0]); }; inp.click();
}
function getChatById(id){ return CHATS.find(c=>c.id===id)||null; }
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

function rollingAvg(obj, w=7){
  const keys=Object.keys(obj).sort(), vals=keys.map(k=>obj[k]), out={};
  keys.forEach((k,i)=>{ const s=vals.slice(Math.max(0,i-w+1),i+1); out[k]=s.reduce((a,b)=>a+b,0)/s.length; });
  return out;
}
function dateToIsoWeek(dateStr){
  var d=new Date(dateStr+'T00:00:00'), day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  var y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return d.getUTCFullYear()+'-W'+String(Math.ceil(((d-y)/86400000+1)/7)).padStart(2,'0');
}
function absWeekly(s){
  var wm={};
  Object.entries(s).forEach(function(kv){ var w=dateToIsoWeek(kv[0]); (wm[w]||(wm[w]=[])).push(Math.abs(kv[1])); });
  var weeks=Object.keys(wm).sort();
  return {weeks,vals:weeks.map(function(w){return wm[w].reduce(function(a,b){return a+b;},0)/wm[w].length;})};
}
function dailyDiff(u,c){
  var diff={};
  Object.keys(u).forEach(function(d){ if(c[d]!==undefined) diff[d]=u[d]-c[d]; });
  return diff;
}
function makeLineChart(cid, labels, datasets){
  destroyChart(cid);
  const ctx=document.getElementById(cid); if(!ctx) return;
  charts[cid]=new Chart(ctx,{type:"line",data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top"},tooltip:{mode:"index"}},scales:{x:{ticks:{maxTicksLimit:12,maxRotation:45}},y:{min:-1,max:1,ticks:{stepSize:0.5}}}}});
}
function makeBarChart(cid, labels, datasets){
  destroyChart(cid);
  const ctx=document.getElementById(cid); if(!ctx) return;
  charts[cid]=new Chart(ctx,{type:"bar",data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top"}},scales:{x:{ticks:{maxTicksLimit:16,maxRotation:45}},y:{beginAtZero:true}}}});
}

// ── Tab definitions ──────────────────────────────────────────────────────────
function getTabsForChat(chatId){
  const isAll = chatId==="all";
  const base=[
    {id:"conversations",label:"Conversations",all:true,single:false},
    {id:"timeline",label:"Timeline",all:true,single:true},
    {id:"visits",label:"Visits & Availability",all:false,single:true},
    {id:"sentiment",label:"Sentiment",all:true,single:true},
    {id:"initiation",label:"Initiation Balance",all:true,single:true},
    {id:"crisis",label:"⚠ Crisis Moments",all:true,single:true},
    {id:"support",label:"Support Given",all:true,single:true},
    {id:"people",label:"People & Sentiment",all:true,single:true},
    {id:"narrative",label:"Narrative vs Record",all:false,single:true},
  ];
  let tabs=base.filter(t=>isAll?t.all:t.single);
  if(!isAll){ const chat=getChatById(chatId); if(chat&&chat.has_framework) tabs.push({id:"framework",label:"Framework",all:false,single:true}); }
  return tabs;
}

function renderTabBar(chatId){
  const tabs=getTabsForChat(chatId);
  document.getElementById("tabBar").innerHTML=tabs.map(t=>
    `<button class="tab-btn${currentTab===t.id?" active":""}" onclick="selectTab('${t.id}')">${t.label}</button>`
  ).join("");
}

function buildSidebar(){
  const sb=document.getElementById("sidebar");
  if(!sb) return;
  sb.querySelectorAll(".sb-btn").forEach(b=>b.remove());
  if(CHATS.length>1){
    const b=document.createElement("button");
    b.className="sb-btn"; b.dataset.chat="all";
    b.innerHTML=`<span class="sb-name">All conversations</span><span class="sb-sub">${CHATS.length} chats</span>`;
    b.onclick=()=>selectChat(b); sb.appendChild(b);
  }
  CHATS.forEach(chat=>{
    const b=document.createElement("button");
    b.className="sb-btn"; b.dataset.chat=chat.id;
    const tags=(chat.tags||[]).map(t=>`<span class="sb-tag">${esc(t)}</span>`).join("");
    const dc=(chat.distress_signals||[]).length;
    b.innerHTML=`<span class="sb-name">${esc(chat.name)}</span>`+
      (chat.relationship?`<span class="sb-sub">${esc(chat.relationship)}</span>`:"")+
      `<div style="margin-top:3px">${tags}${dc?`<span class="sb-flag">⚠ ${dc}</span>`:""}</div>`;
    b.onclick=()=>selectChat(b); sb.appendChild(b);
  });
}
function selectChat(btn){
  document.querySelectorAll(".sb-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  currentChat=btn.dataset.chat;
  const availTabs=getTabsForChat(currentChat).map(t=>t.id);
  if(!availTabs.includes(currentTab)){
    if(currentChat==="all"){
      currentTab="conversations";
    } else {
      currentTab=availTabs.includes(_lastSingleTab)?_lastSingleTab:"timeline";
    }
  }
  renderTabBar(currentChat);
  renderMain();
}
function selectTab(tabId){
  currentTab=tabId;
  if(currentChat!=="all") _lastSingleTab=tabId;
  renderTabBar(currentChat);
  renderMain();
}

function renderMain(){
  const el=document.getElementById("mainContent");
  if(!currentChat){ el.innerHTML=""; return; }
  if(currentChat==="all"){
    switch(currentTab){
      case "conversations": renderConversations(el); break;
      case "timeline":      renderMergedTimeline(el); break;
      case "sentiment":     renderSentimentChart(el,CHATS); break;
      case "initiation":    renderInitiation(el,CHATS); break;
      case "crisis":        renderCrisis(el,CHATS); break;
      case "support":       renderSupport(el,CHATS); break;
      case "people":        renderPeople(el); break;
      default: renderConversations(el);
    }
  } else {
    const chat=getChatById(currentChat);
    if(!chat){ el.innerHTML=`<p class="no-data">Chat not found.</p>`; return; }
    switch(currentTab){
      case "timeline":   renderTimeline(el,chat); break;
      case "visits":     renderVisits(el,chat); break;
      case "sentiment":  renderSentimentChart(el,[chat]); break;
      case "initiation": renderInitiation(el,[chat]); break;
      case "crisis":     renderCrisis(el,[chat]); break;
      case "support":    renderSupport(el,[chat]); break;
      case "people":     renderPeople(el); break;
      case "narrative":  renderNarrative(el,chat); break;
      case "framework":  renderFramework(el,chat); break;
      default: renderTimeline(el,chat);
    }
  }
}

          <div style="color:var(--muted);font-size:12px">${esc(chat.relationship)} · ${chat.message_count.toLocaleString()} messages</div></div>
        <div style="font-size:13px;color:var(--muted)">Distress: <b>${chat.distress_signals.length}</b></div>
      </div>
      <div style="margin-top:12px">
        <div class="bar-label"><span>Initiation: You ${init.user_pct}%</span><span>Them ${init.contact_pct}%</span></div>
        <div class="bar"><div class="bar-user" style="width:${init.user_pct}%"></div><div class="bar-contact" style="width:${init.contact_pct}%"></div></div>

  });
  html+=`</div>`;
  if(CROSS_CHAT_LINKS.length){
    html+=`<div class="card"><h2>Cross-chat pattern links</h2>`;
    CROSS_CHAT_LINKS.forEach(l=>{ html+=`<div class="cross-chat-card"><div style="font-weight:600;margin-bottom:4px">${esc(l.date_range)} — ${esc(l.chats_involved)}</div><div>${esc(l.pattern)}</div><div style="color:var(--muted);font-size:12px;margin-top:4px">${esc(l.significance)}</div></div>`; });
    html+=`</div>`;
  }
  html+=`<div class="card"><h2>Key timeline moments</h2>`;
  TIMELINE_HIGHLIGHTS.forEach(h=>{
    html+=`<div class="timeline-event ${esc(h.type)}"><div class="event-date">${fmt(h.date)} — ${esc(h.chat)}</div><div>${esc(h.significance)}</div></div>`;

// ── Timeline ──────────────────────────────────────────────────────────────────
function renderTimeline(el, chat){
  el.innerHTML=`<div class="notes-toolbar">
    <span style="font-size:12px;color:var(--muted)">📝 Notes are saved in your browser. Back them up to keep them safe.</span>
    <div style="display:flex;gap:8px">
      <button class="btn-note-action" onclick="exportNotes()">⬇ Export notes</button>
      <button class="btn-note-action" onclick="importNotes()">⬆ Import notes</button>
    </div>
  </div>`;
  const byDate={};
  chat.messages_for_timeline.forEach(m=>{ (byDate[m.date]||(byDate[m.date]=[])).push(m); });
  let html=`<div>`;
  Object.keys(byDate).sort().forEach(date=>{
    const msgs=byDate[date];
    const intents=[...new Set(msgs.flatMap(m=>m.intents))];
    html+=`<div class="bubble-day"><div class="day-label">${fmt(date)}${intents.map(badge).join("")}</div>`;
    msgs.forEach(m=>{
      html+=`<div class="bubble ${m.is_user?"user":"contact"}"><div class="bubble-inner">${esc(m.text)}</div></div>`;
    });
    html+=`<div class="note-section">
      <div class="note-label"><span>📝</span> Your private notes — saved in this browser only</div>
      <textarea class="note" placeholder="Add context, reflections, or anything worth remembering about this day…" onchange="saveNote('${chat.id}','${date}',this.value)">${esc(loadNote(chat.id,date))}</textarea>
    </div></div>`;
  });
  html+=`</div>`;
  el.innerHTML += html;
}
function renderMergedTimeline(el){
  const all=[];
  CHATS.forEach(c=>c.messages_for_timeline.forEach(m=>all.push({...m,chat_name:c.name,chat_id:c.id})));
  all.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const byDate={};
  all.forEach(m=>{ (byDate[m.date]||(byDate[m.date]=[])).push(m); });
  const colors={"Contact_A":"#1a73e8","Contact_B":"#e91e63"};
  let html=`<div>`;
  Object.keys(byDate).sort().forEach(date=>{
    const msgs=byDate[date], byChat={};
    msgs.forEach(m=>{ (byChat[m.chat_id]||(byChat[m.chat_id]=[])).push(m); });
    html+=`<div class="bubble-day"><div class="day-label">${fmt(date)}</div>`;
    Object.entries(byChat).forEach(([cid,cMsgs])=>{
      const col=colors[cid]||"#718096", chat=getChatById(cid);
      html+=`<div style="border-left:3px solid ${col};padding-left:10px;margin-bottom:8px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px">${esc(chat?chat.name:cid)}</div>`;
      cMsgs.slice(0,4).forEach(m=>{ html+=`<div class="bubble ${m.is_user?"user":"contact"}"><div class="bubble-inner">${esc(m.text.slice(0,200))}</div></div>`; });
      html+=`</div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

// ── Sentiment ─────────────────────────────────────────────────────────────────
function renderSentimentChart(el, chats){
  const colors=["#25D366","#1a73e8","#e91e63","#ff9800"];
  const colorsDash=["#25D366cc","#1a73e8cc","#e91e63cc","#ff9800cc"];

  // Chart 1: Mood
  el.innerHTML=`
    <div class="card">
      <h2>Mood over time</h2>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Score runs from <b>−1</b> (most negative) through <b>0</b> (neutral) to <b>+1</b> (most positive). Plotted as a 7-day rolling average. Solid = you &nbsp;|&nbsp; Dashed = contact.</p>
      <div class="chart-wrap"><canvas id="sentChart"></canvas></div>
    </div>
    <div class="card">
      <h2>Message volume</h2>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Messages sent per week. Gaps or sudden drops often indicate silence, conflict, or a change in the relationship.</p>
      <div class="chart-wrap-sm"><canvas id="volChart"></canvas></div>
    </div>`;

  // Extend dates to include any crisis/distress dates not in sentiment series
  const _flagDates=chats.flatMap(c=>
    [...(c.crisis_flags||[]),...(c.distress_signals||[])].map(s=>s.date).filter(Boolean)
  );
  const allDates=[...new Set([
    ...chats.flatMap(c=>Object.keys(c.daily_sentiment.user||{}).concat(Object.keys(c.daily_sentiment.contact||{}))),
    ..._flagDates
  ])].sort();

  const sentDS=[];
  chats.forEach((chat,i)=>{
    const uA=rollingAvg(chat.daily_sentiment.user||{}), cA=rollingAvg(chat.daily_sentiment.contact||{});
    const lbl=chats.length>1?chat.name:"";

    // Mood lines
    sentDS.push({label:lbl?`You (${lbl})`:"You",data:allDates.map(d=>uA[d]??null),borderColor:colors[i],backgroundColor:colors[i]+"22",borderWidth:2,pointRadius:1,spanGaps:true,tension:.3});
    sentDS.push({label:lbl?chat.name:chat.name,data:allDates.map(d=>cA[d]??null),borderColor:colorsDash[i],backgroundColor:"transparent",borderWidth:2,borderDash:[4,4],pointRadius:1,spanGaps:true,tension:.3});

    // Distress markers — orange circles near chart bottom
    const distressMap={};
    (chat.distress_signals||[]).forEach(s=>{ if(s.date)(distressMap[s.date]||(distressMap[s.date]=[])).push(s.text.slice(0,140)); });
    if(Object.keys(distressMap).length){
      sentDS.push({label:lbl?`Distress (${lbl})`:"Distress signal",
        data:allDates.map(d=>distressMap[d]?-0.87:null),_tips:distressMap,
        backgroundColor:"rgba(245,158,11,.9)",borderColor:"rgba(245,158,11,1)",
        pointStyle:"circle",pointRadius:8,pointHoverRadius:11,showLine:false,spanGaps:false});
    }

    // Crisis flag markers — red triangles at very bottom
    const crisisMap={};
    (chat.crisis_flags||[]).forEach(s=>{ if(s.date)(crisisMap[s.date]||(crisisMap[s.date]=[])).push(s.text.slice(0,140)); });
    if(Object.keys(crisisMap).length){
      sentDS.push({label:lbl?`Crisis flag (${lbl})`:"Crisis flag",
        data:allDates.map(d=>crisisMap[d]?-0.97:null),_tips:crisisMap,
        backgroundColor:"rgba(239,68,68,.9)",borderColor:"rgba(239,68,68,1)",
        pointStyle:"triangle",pointRadius:9,pointHoverRadius:12,showLine:false,spanGaps:false});
    }
  });

  requestAnimationFrame(function(){
    destroyChart("sentChart");
    const ctx=document.getElementById("sentChart"); if(!ctx) return;
    charts["sentChart"]=new Chart(ctx,{type:"line",data:{labels:allDates,datasets:sentDS},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:"top"},tooltip:{mode:"index",callbacks:{label:function(c2){
          const ds=c2.dataset;
          if(ds._tips){const t=ds._tips[allDates[c2.dataIndex]]; return t?ds.label+': "'+t[0]+'"':null;}
          if(c2.parsed.y===null||c2.parsed.y===undefined) return null;
          return ds.label+': '+c2.parsed.y.toFixed(2);
        }}}},
        scales:{x:{ticks:{maxTicksLimit:12,maxRotation:45}},y:{min:-1,max:1,ticks:{stepSize:0.5}}}}});
  });

  // Chart 2: Volume
  const allWeeks=[...new Set(chats.flatMap(c=>(c.weekly_volume&&c.weekly_volume.weeks)||[]))].sort();
  const volDS=[];
  chats.forEach((chat,i)=>{
    if(!chat.weekly_volume) return;
    const wm={}; chat.weekly_volume.weeks.forEach((w,j)=>{ wm[w]={u:chat.weekly_volume.user[j],c:chat.weekly_volume.contact[j]}; });
    const lbl=chats.length>1?chat.name:"";
    volDS.push({label:lbl?`You (${lbl})`:"You",data:allWeeks.map(w=>wm[w]?wm[w].u:0),backgroundColor:`rgba(37,211,102,${chats.length>1?.5:.7})`,borderRadius:3,borderWidth:0});
    volDS.push({label:lbl?chat.name:chat.name,data:allWeeks.map(w=>wm[w]?wm[w].c:0),backgroundColor:`rgba(26,115,232,${chats.length>1?.35:.5})`,borderRadius:3,borderWidth:0});
  });
  requestAnimationFrame(()=>makeBarChart("volChart",allWeeks.map((w,i)=>i%2===0?w:""),volDS));

  // Chart 3: Emotional intensity
  var intCard=document.createElement('div'); intCard.className='card';
  intCard.innerHTML=`<h2>Emotional intensity</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">How strongly felt messages are each week — regardless of positive or negative direction. 0 = neutral tone, 1 = maximum intensity. Useful for spotting high-charge periods even when overall sentiment is mixed.</p>
    <div class="chart-wrap-sm"><canvas id="intChart"></canvas></div>`;
  el.appendChild(intCard);
  const intDS=[], intWeeksAll=new Set();
  chats.forEach((chat,i)=>{
    const uI=absWeekly(chat.daily_sentiment.user||{}), cI=absWeekly(chat.daily_sentiment.contact||{});
    uI.weeks.forEach(w=>intWeeksAll.add(w)); cI.weeks.forEach(w=>intWeeksAll.add(w));
    const uM={}, cM={};
    uI.weeks.forEach((w,j)=>uM[w]=uI.vals[j]); cI.weeks.forEach((w,j)=>cM[w]=cI.vals[j]);
    const allIW=[...intWeeksAll].sort(), lbl=chats.length>1?chat.name:"";
    intDS.push({label:lbl?`You (${lbl})`:"You",data:allIW.map(w=>uM[w]??null),borderColor:colors[i],backgroundColor:colors[i]+"22",borderWidth:2,pointRadius:1,spanGaps:true,tension:.3});
    intDS.push({label:lbl?chat.name:chat.name,data:allIW.map(w=>cM[w]??null),borderColor:colorsDash[i],backgroundColor:"transparent",borderWidth:2,borderDash:[4,4],pointRadius:1,spanGaps:true,tension:.3});
    if(i===chats.length-1) requestAnimationFrame(()=>{
      destroyChart("intChart");
      var ctx=document.getElementById("intChart"); if(!ctx) return;
      charts["intChart"]=new Chart(ctx,{type:"line",data:{labels:[...intWeeksAll].sort(),datasets:intDS},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top"}},
          scales:{x:{ticks:{maxTicksLimit:14,maxRotation:45}},y:{min:0,max:1,ticks:{stepSize:0.25}}}}});
    });
  });

  // Chart 4: Sentiment divergence
  var divCard=document.createElement('div'); divCard.className='card';
  divCard.innerHTML=`<h2>Sentiment gap — you vs them</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Your mood score minus theirs on days where both sent messages. <b>Above 0</b>: you were more positive. <b>Below 0</b>: they were more positive. Persistent gaps can signal disconnection or one-sided emotional labour.</p>
    <div class="chart-wrap-sm"><canvas id="divChart"></canvas></div>`;
  el.appendChild(divCard);
  const divDS=[], divColors=["#7c3aed","#0891b2","#be185d"];
  chats.forEach((chat,i)=>{
    const diff=dailyDiff(chat.daily_sentiment.user||{},chat.daily_sentiment.contact||{});
    const avg=rollingAvg(diff,7), diffDates=Object.keys(avg).sort();
    const lbl=chats.length>1?chat.name:"";
    divDS.push({label:lbl||"Gap",data:diffDates.map(d=>avg[d]??null),borderColor:divColors[i%3],
      backgroundColor:(ctx2)=>{ const v=ctx2.raw; return v==null?"transparent":v>=0?"rgba(16,185,129,.15)":"rgba(239,68,68,.15)"; },
      borderWidth:2,pointRadius:1,spanGaps:true,tension:.3,fill:true});
    if(i===chats.length-1) requestAnimationFrame(()=>{
      destroyChart("divChart");
      var ctx=document.getElementById("divChart"); if(!ctx) return;
      charts["divChart"]=new Chart(ctx,{type:"line",data:{labels:diffDates,datasets:divDS},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top"}},
          scales:{x:{ticks:{maxTicksLimit:14,maxRotation:45}},y:{min:-1,max:1,ticks:{stepSize:0.5},
            grid:{color:(ctx3)=>ctx3.tick.value===0?"#94a3b8":"#e2e8f0"}}}}});
    });
  });
}

// ── Initiation ────────────────────────────────────────────────────────────────
function renderInitiation(el, chats){
  let html=`<div class="card"><h2>Initiation Balance</h2>`;
  chats.forEach(chat=>{
    const init=chat.initiation_balance;
    html+=`<div style="margin-bottom:20px">${chats.length>1?`<h3>${esc(chat.name)}</h3>`:""}
      <div class="bar-label"><span>You: ${init.user_pct}% (${init.user_count})</span><span>${esc(chat.name)}: ${init.contact_pct}% (${init.contact_count})</span></div>
      <div class="bar"><div class="bar-user" style="width:${init.user_pct}%"></div><div class="bar-contact" style="width:${init.contact_pct}%"></div></div>
      <div style="font-size:12px;color:var(--muted)">Trend: ${init.trend}</div></div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

// ── Crisis ────────────────────────────────────────────────────────────────────
function renderCrisis(el, chats){
  let html=`<div class="card"><h2>Crisis Moments</h2>
    <button style="background:var(--danger);color:#fff;border:none;padding:10px 20px;border-radius:var(--radius);cursor:pointer;font-size:14px;margin-bottom:16px" onclick="this.nextElementSibling.style.display='block';this.style.display='none'">Click to reveal flagged messages</button>
    <div style="display:none">`;
  let any=false;
  chats.forEach(chat=>{
    if(!chat.crisis_flags.length) return;
    any=true;
    if(chats.length>1) html+=`<h3>${esc(chat.name)}</h3>`;
    chat.crisis_flags.forEach(f=>{ html+=`<div style="border:1px solid var(--danger);border-radius:var(--radius);padding:12px;margin-bottom:10px"><div style="font-size:11px;color:var(--muted)">${fmt(f.date)}</div><div style="font-size:13px">${esc(f.text)}</div></div>`; });
  });
  if(!any) html+=`<p style="color:var(--muted);font-size:14px">No crisis flags detected in this data.</p>`;
  html+=`</div><div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius);padding:14px;font-size:14px;margin-top:16px">
    <b>If you are concerned about immediate safety:</b><br>Call <b>999</b> (emergency) or <b>Samaritans on 116 123</b> (free, 24/7, UK)</div></div>`;
  el.innerHTML=html;
}

// ── Support ───────────────────────────────────────────────────────────────────
function renderSupport(el, chats){
  let html=`<div class="card"><h2>Support Given</h2>`;
  let any=false;
  chats.forEach(chat=>{
    if(!chat.financial_requests.length) return;
    any=true;
    if(chats.length>1) html+=`<h3>${esc(chat.name)}</h3>`;
    chat.financial_requests.forEach(r=>{ html+=`<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--muted);font-size:11px">${fmt(r.date)} · ${esc(r.sender)}</span><br>${esc(r.text)}</div>`; });
  });
  if(!any) html+=`<p class="no-data">No financial requests detected.</p>`;
  html+=`</div>`;
  el.innerHTML=html;
}

// ── People ────────────────────────────────────────────────────────────────────
function renderPeople(el){
  const names=Object.keys(PEOPLE);
  if(!names.length){ el.innerHTML=`<p class="no-data">No recurring names detected.</p>`; return; }
  let html=`<div class="card"><h2>People & Sentiment</h2>`;
  names.forEach(name=>{
    const p=PEOPLE[name], ai=PEOPLE_AI[name]||{}, sd=p.sentiment_dist||{};
    html+=`<div class="person-card">
      <div class="name">${esc(name)} <span style="font-size:12px;color:var(--muted);font-weight:400">×${p.count} mentions · ${p.chats.join(", ")}</span></div>
      ${ai.sentiment_label?`<div class="label">${esc(ai.sentiment_label)}</div>`:""}
      <div class="sb-wrap"><div class="sb-pos" style="width:${sd.positive||0}%"></div><div class="sb-neu" style="width:${sd.neutral||0}%"></div><div class="sb-neg" style="width:${sd.negative||0}%"></div></div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">+${sd.positive||0}% / =${sd.neutral||0}% / −${sd.negative||0}%</div>
      ${ai.warning_flag?`<div style="background:#fef3c7;border-radius:4px;padding:8px;font-size:12px;margin-bottom:8px">⚠ ${esc(ai.warning_flag)}</div>`:""}
      ${ai.summary?`<div style="font-size:13px;margin-bottom:8px">${esc(ai.summary)}</div>`:""}
      ${p.excerpts&&p.excerpts.length?`<details><summary style="font-size:12px;color:var(--muted);cursor:pointer">Show excerpts</summary><div style="margin-top:8px">${p.excerpts.map(e=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">"${esc(e)}"</div>`).join("")}</div></details>`:""}
    </div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

// ── Narrative vs Record ───────────────────────────────────────────────────────
function renderNarrative(el, chat){
  let html=`<div class="card"><h2>Narrative vs Record — ${esc(chat.name)}</h2>`;
  if(!chat.narrative_vs_record.length){ html+=`<p class="no-data">No contrasts generated.</p>`; }
  else { chat.narrative_vs_record.forEach(p=>{ html+=`<div class="contrast-pair"><div class="claimed">${esc(p.claimed)}</div><div class="record">${esc(p.record_shows)}</div></div>`; }); }
  html+=`</div>`;
  const corr=CROSS_CHAT.correlations.filter(c=>c.chats&&c.chats.includes(chat.name));
  if(corr.length){
    html+=`<div class="card"><h2>Cross-chat correlations</h2>`;
    corr.forEach(c=>{ html+=`<div class="cross-chat-card"><div style="font-weight:600">${fmt(c.date)} — ${esc(c.type)}</div><div>${esc(c.summary)}</div></div>`; });
    html+=`</div>`;
  }
  el.innerHTML=html;
}

// ── Framework ─────────────────────────────────────────────────────────────────
function renderFramework(el, chat){
  let html=`<div class="card"><h2>Communications Framework — ${esc(chat.name)}</h2>`;
  if(chat.framework_content) html+=`<pre style="white-space:pre-wrap;font-size:13px;line-height:1.7;padding:16px;background:var(--bg);border-radius:var(--radius);margin-bottom:16px">${esc(chat.framework_content)}</pre>`;
  if(chat.framework_suggestions&&chat.framework_suggestions.length){
    html+=`<h3 style="margin-bottom:10px">AI-suggested adjustments</h3>`;
    chat.framework_suggestions.forEach(s=>{ html+=`<div class="fw-item"><div class="fw-original">${esc(s.framework_item)}</div><div class="fw-suggestion">Suggested: ${esc(s.suggested_adjustment)}</div><div class="fw-basis">Based on: ${esc(s.data_basis)}</div></div>`; });
  }
  html+=`</div>`;
  el.innerHTML=html;
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init(){
  buildSidebar();
  const defaultBtn=CHATS.length>1
    ? document.querySelector('[data-chat="all"]')
    : document.querySelector(".sb-btn");
  if(defaultBtn) selectChat(defaultBtn);
})();
</script>
</body>
